[package]
name = "tolarix-desktop"
version = "0.1.0"
description = "Tolarix desktop app: runs the Tolarix server as a sidecar and shows its UI"
authors = ["Davide Maggi"]
license = "GPL-3.0-only"
repository = "https://github.com/davidemaggi/tolarix"
edition = "2024"
rust-version = "1.90"

[lib]
name = "tolarix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
getrandom = "0.3"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
