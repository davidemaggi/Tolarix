<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tolarix</title>
    <link rel="stylesheet" href="splash.css" />
    <script src="splash.js" defer></script>
  </head>
  <body>
    <main>
      <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="7" fill="#0f766e" />
        <path d="M8 10h16M16 10v14" stroke="#fff" stroke-width="3.5" stroke-linecap="round" />
        <circle cx="23" cy="22" r="3" fill="#99f6e4" />
      </svg>
      <h1>Tolarix</h1>
      <p id="status" role="status" aria-live="polite">Starting…</p>
      <section id="error" hidden>
        <h2 id="error-title">Tolarix could not start</h2>
        <pre id="error-detail"></pre>
        <p id="error-hint">Close the app and open it again. If the problem persists, check the log.</p>
      </section>
    </main>
  </body>
</html>
