name: Desktop installers

# Builds the desktop app (Tauri + the tolarix sidecar) for Windows, macOS and
# Linux. The Windows installers are code-signed when the signing runner is
# online (sign-windows.yml); macOS and Linux installers are unsigned.
# On tags, release.yml calls this workflow with the draft release to fill.
#
# Signed Windows build, after the unsigned one:
#   1. sign-app        signs tolarix-desktop.exe and the tolarix.exe sidecar  (self-hosted)
#   2. package-signed  wraps them in the MSI and NSIS installers, unchanged    (GitHub)
#   3. sign-installer  signs the installers                                    (self-hosted)
#   4. publish-signed  replaces the unsigned installers in the draft release
# Run it by hand to try the signing without a release: the signed installers
# are then a workflow artifact.
on:
  workflow_dispatch:
    inputs:
      sign:
        description: Sign the Windows build (needs the signing runner)
        type: boolean
        default: true
  push:
    branches: [main]
  workflow_call:
    inputs:
      release-id:
        description: Draft release that receives the installers
        type: string
        required: true
      sign:
        description: Sign the Windows build (needs the signing runner)
        type: boolean
        default: true

permissions:
  contents: write # uploads to the draft release

concurrency:
  group: desktop-${{ github.ref }}-${{ inputs.release-id || 'build' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS (Apple silicon), os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS (Intel), os: macos-latest, target: x86_64-apple-darwin }
          - { name: Windows (x64), os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: Linux (x64), os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the version comes from git describe
      - name: System libraries for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: ${{ matrix.target }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # beforeBuildCommand (desktop/scripts/sidecar.mjs) builds the sidecar
      # for the target.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }}
          # Empty outside a release: build only.
          releaseId: ${{ inputs.release-id || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: tolarix-desktop-${{ matrix.target }}
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 14
      # The app before it's wrapped in the installers: the signed build starts from here.
      # Paths are relative to desktop/src-tauri, where package-signed puts them back.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-unbundled
          path: |
            desktop/src-tauri/target/${{ matrix.target }}/release/tolarix-desktop.exe
            desktop/src-tauri/binaries/tolarix-${{ matrix.target }}.exe
          if-no-files-found: error
          retention-days: 1

  # Matrix legs overwrite each other's outputs: look the artifact up instead. The newest
  # one wins when a re-run left several. Empty when the Windows leg failed.
  windows-unbundled:
    name: Find the Windows app
    needs: build
    if: ${{ !cancelled() && inputs.sign }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      id: ${{ steps.find.outputs.id }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN: ${{ github.run_id }}
        run: |
          id=$(gh api "repos/$REPO/actions/runs/$RUN/artifacts" --paginate \
            --jq '.artifacts[] | select(.name == "windows-unbundled") | .id' | sort -n | tail -1)
          [ -n "$id" ] || echo "::warning::The Windows build failed: nothing to sign"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  sign-app:
    name: Sign the app (Windows)
    needs: windows-unbundled
    if: needs.windows-unbundled.outputs.id != ''
    uses: ./.github/workflows/sign-windows.yml
    secrets: inherit
    with:
      artifact-id: ${{ needs.windows-unbundled.outputs.id }}
      name: windows-unbundled-signed
      files: |
        target/x86_64-pc-windows-msvc/release/tolarix-desktop.exe
        binaries/tolarix-x86_64-pc-windows-msvc.exe

  package-signed:
    name: Installers from the signed app (Windows)
    needs: sign-app
    if: needs.sign-app.outputs.artifact-id != ''
    runs-on: windows-latest
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-id }}
    env:
      TARGET: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # tauri bundle reads the project with cargo metadata; it compiles nothing
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign-app.outputs.artifact-id }}
          merge-multiple: true # by id it would still unpack into a folder named after the artifact
          path: desktop/src-tauri
      # --no-binary-patching: the bundler would otherwise write the bundle type into
      # tolarix-desktop.exe and break its signature (only the updater, unused, reads it)
      - name: Package
        working-directory: desktop
        run: pnpm tauri bundle --target ${{ env.TARGET }} --bundles msi,nsis --no-binary-patching
      # The installers must carry the signed files byte for byte: unpack them and
      # look for both by hash
      - name: Check the installers hold the signed files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $signed = @(
            "desktop/src-tauri/target/$env:TARGET/release/tolarix-desktop.exe",
            "desktop/src-tauri/binaries/tolarix-$env:TARGET.exe"
          )
          $bundle = "desktop/src-tauri/target/$env:TARGET/release/bundle"
          $installers = @(Get-ChildItem "$bundle/msi/*.msi", "$bundle/nsis/*-setup.exe")
          if ($installers.Count -ne 2) { throw "Expected one MSI and one NSIS installer, got: $($installers.Name -join ', ')" }
          foreach ($i in $installers) {
            $dir = Join-Path $env:RUNNER_TEMP "unpack-$($i.BaseName)"
            if ($i.Extension -eq '.msi') {
              # Administrative install: unpacks the files, installs nothing
              $p = Start-Process msiexec.exe -Wait -PassThru -ArgumentList @('/a', "`"$($i.FullName)`"", '/qn', "TARGETDIR=`"$dir`"")
              if ($p.ExitCode) { throw "msiexec could not unpack $($i.Name) ($($p.ExitCode))" }
            } else {
              7z x -y "-o$dir" $i.FullName | Out-Null
              if ($LASTEXITCODE) { throw "7z could not unpack $($i.Name)" }
            }
            $inside = @(Get-ChildItem $dir -Recurse -File | Get-FileHash -Algorithm SHA256 | ForEach-Object Hash)
            foreach ($f in $signed) {
              if ((Get-FileHash $f -Algorithm SHA256).Hash -notin $inside) { throw "$($i.Name) does not hold the signed $(Split-Path $f -Leaf)" }
            }
            Write-Host "$($i.Name) holds the signed files"
          }
      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: windows-installers
          path: |
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/msi/*.msi
            desktop/src-tauri/target/${{ env.TARGET }}/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1

  # The installer names carry the version: list them for sign-installer
  installer-names:
    name: Installer names
    needs: package-signed
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.list.outputs.files }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.package-signed.outputs.artifact }}
          merge-multiple: true # by id it would still unpack into a folder named after the artifact
          path: installers
      - id: list
        run: |
          {
            echo "files<<EOF"
            (cd installers && find . -type f | sed 's|^\./||' | sort)
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  sign-installer:
    name: Sign the installers (Windows)
    needs: [package-signed, installer-names]
    uses: ./.github/workflows/sign-windows.yml
    secrets: inherit
    with:
      artifact-id: ${{ needs.package-signed.outputs.artifact }}
      name: tolarix-desktop-windows-signed
      files: ${{ needs.installer-names.outputs.files }}

  publish-signed:
    name: Signed installers to the draft release
    needs: sign-installer
    if: inputs.release-id && needs.sign-installer.outputs.artifact-id
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign-installer.outputs.artifact-id }}
          merge-multiple: true # by id it would still unpack into a folder named after the artifact
          path: signed
      # Same names as the unsigned installers tauri-action uploaded: --clobber replaces them
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          files=$(find signed -type f)
          assets=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for f in $files; do
            if ! grep -qxF "$(basename "$f")" <<< "$assets"; then
              echo "::warning::$(basename "$f") was not in the draft: the unsigned installer with another name stays next to it"
            fi
          done
          gh release upload "$TAG" $files --clobber
