name: Release

# Pushing a tag vX.Y.Z publishes a release:
#   1. a draft GitHub release with the notes from CHANGELOG.md;
#   2. CLI/server archives for Linux, macOS and Windows (amd64, arm64) + SHA256SUMS;
#   3. the multi-arch Docker image ghcr.io/<owner>/tolarix:X.Y.Z (also X.Y, X, latest);
#   4. the desktop installers (desktop.yml), uploaded to the same draft.
# The Windows executables (CLI and desktop) are code-signed when the signing
# runner is online (sign-windows.yml); otherwise they stay unsigned, with a warning.
# The release stays a draft: review it and publish it by hand.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    name: Draft release
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.create.outputs.id }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the version
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -1)
          if [ "$cargo" != "$version" ]; then
            echo "::error::desktop/src-tauri/Cargo.toml has version $cargo, the tag says $version"
            exit 1
          fi
          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create the draft
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The section of CHANGELOG.md for this version, without its heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "Tolarix $GITHUB_REF_NAME" --notes-file notes.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  cli:
    name: CLI archives
    needs: draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      - run: node scripts/package-cli.mjs
        env:
          TOLARIX_VERSION: ${{ needs.draft.outputs.version }}
      - name: Upload to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS
      # The Windows executables, for sign-cli: windows_<arch>/tolarix.exe
      - name: Windows executables
        env:
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            mkdir -p "cli-windows/windows_$arch"
            unzip -j "dist/tolarix_${VERSION}_windows_$arch.zip" "tolarix_${VERSION}_windows_$arch/tolarix.exe" -d "cli-windows/windows_$arch"
          done
      - uses: actions/upload-artifact@v4
        id: windows
        with:
          name: cli-windows
          path: cli-windows/
          if-no-files-found: error
          retention-days: 1
    outputs:
      windows: ${{ steps.windows.outputs.artifact-id }}

  sign-cli:
    name: Sign the CLI (Windows)
    needs: cli
    uses: ./.github/workflows/sign-windows.yml
    secrets: inherit
    with:
      artifact-id: ${{ needs.cli.outputs.windows }}
      name: cli-windows-signed
      files: |
        windows_amd64/tolarix.exe
        windows_arm64/tolarix.exe

  cli-signed:
    name: Signed CLI to the draft release
    needs: [draft, sign-cli]
    if: needs.sign-cli.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.sign-cli.outputs.artifact-id }}
          merge-multiple: true # by id it would still unpack into a folder named after the artifact
          path: signed
      # Put the signed tolarix.exe into the Windows archives and refresh their checksums
      - name: Repack and upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.draft.outputs.version }}
        run: |
          mkdir out && cd out
          gh release download "$GITHUB_REF_NAME" --pattern '*_windows_*.zip' --pattern SHA256SUMS
          for arch in amd64 arm64; do
            name="tolarix_${VERSION}_windows_$arch"
            mkdir -p "stage/$name"
            cp "../signed/windows_$arch/tolarix.exe" "stage/$name/tolarix.exe"
            (cd stage && zip -q "../$name.zip" "$name/tolarix.exe")
            grep -v -F "  $name.zip" SHA256SUMS > SHA256SUMS.new || true
            sha256sum "$name.zip" >> SHA256SUMS.new
            mv SHA256SUMS.new SHA256SUMS
          done
          sort -k2 SHA256SUMS -o SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" ./*_windows_*.zip SHA256SUMS --clobber

  docker:
    name: Docker image
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/tolarix
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - id: date
        run: echo "now=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.draft.outputs.version }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.now }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    name: Desktop installers
    needs: draft
    uses: ./.github/workflows/desktop.yml
    secrets: inherit
    with:
      release-id: ${{ needs.draft.outputs.id }}
