# Tolarix with a persistent data volume and an Obsidian vault folder.
#   docker compose -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml logs tolarix   # one-time admin password
# In the web UI, an Obsidian connection uses the path inside the container,
# for example /vaults/team.
services:
  tolarix:
    image: tolarix:latest
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TOLARIX_TIMEZONE: Europe/Rome
      # Behind an HTTPS reverse proxy: set the proxy's address so client IPs
      # (used by the login rate limit) are read from X-Forwarded-For.
      # TOLARIX_TRUSTED_PROXIES: 172.16.0.0/12
      # Cookies are Secure when the request arrives over HTTPS; force it with "true".
      # TOLARIX_COOKIE_SECURE: "true"
    volumes:
      # Database and encryption key. Back this up together.
      - tolarix-data:/data
      # Obsidian vaults. The container runs as uid 65532: make the folder
      # writable for it if Tolarix mirrors into it.
      - ./vaults:/vaults

volumes:
  tolarix-data:
